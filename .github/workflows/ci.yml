name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train a baseline model
        # Uses a throwaway MLflow DB so CI never touches the committed history.
        run: python train.py --n_estimators 100 --max_depth 6 --force --tracking_uri sqlite:///ci_mlflow.db

      - name: Run tests
        run: pytest -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: train-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image
        run: docker build -t claimguard .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name pg claimguard
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q ClaimGuard
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict -H 'Content-Type: application/json' -d '{"age":200}')
          test "$code" = "422"
          docker images claimguard --format 'Image size: {{.Size}}'
